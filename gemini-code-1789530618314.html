<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - [ชื่อธุรกิจ]</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">[ชื่อธุรกิจ]</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="work.html">Work</a></li>
            <li><a href="process.html">Process</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <header style="padding: 60px 5%; text-align: center;">
        <h1 style="font-size: 3.5rem; margin-bottom: 15px;">ติดต่อเรา</h1>
        <p style="font-size: 1.2rem; font-weight: 600;">พร้อมเริ่มโปรเจกต์ใหม่หรือยัง? ทักมาคุยกันได้เลย!</p>
    </header>

    <section style="padding: 20px 5% 80px 5%; max-width: 700px; margin: 0 auto;">
        <div class="bold-card" style="background: var(--pastel-yellow);">
            <form style="display: flex; flex-direction: column; gap: 20px;">
                <div>
                    <label style="display: block; font-weight: 800; margin-bottom: 80px; text-transform: uppercase;">ชื่อของคุณ</label>
                    <input type="text" placeholder="ระบุชื่อจริงหรือนามแฝง..." style="width: 100%; padding: 14px; border: var(--border-bold); font-family: var(--font-body); font-weight: 600; background: var(--pure-white);">
                </div>
                <div>
                    <label style="display: block; font-weight: 800; margin-bottom: 8px; text-transform: uppercase;">อีเมลติดต่อ</label>
                    <input type="email" placeholder="example@email.com" style="width: 100%; padding: 14px; border: var(--border-bold); font-family: var(--font-body); font-weight: 600; background: var(--pure-white);">
                </div>
                <div>
                    <label style="display: block; font-weight: 800; margin-bottom: 8px; text-transform: uppercase;">ข้อความ / รายละเอียดโปรเจกต์</label>
                    <textarea rows="5" placeholder="เล่าไอเดียหรือความต้องการของคุณให้เราฟัง..." style="width: 100%; padding: 14px; border: var(--border-bold); font-family: var(--font-body); font-weight: 600; background: var(--pure-white);"></textarea>
                </div>
                <button type="submit" class="btn-bold" style="background: var(--pastel-orange); width: 100%; text-align: center; border: var(--border-bold); font-size: 1.1rem; padding: 16px;">ส่งข้อความหาเราเลย 🚀</button>
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 [ชื่อธุรกิจ]. All Rights Reserved. Stay Bold & Creative!</p>
    </footer>

</body>
</html>
